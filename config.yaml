# Grader stage config - deadline grade & report (JOB_KIND=grade).
#
# Lint (flake8) and compile check every .py file in the submission (any
# filenames; solution.py is not special). Lint uses on_failure: continue
# so every check runs and is reported; a lint or compile failure marks the
# grade as failed (automatic zero, see docs/build.md). Ordered steps +
# optional tests. Commands are argv arrays (no shell). ${SUBMISSION} and
# ${TESTS_DIR} are exported by the framework at runtime.

steps:
  - name: lint
    command:
      - flake8
      - "--ignore=E501,E704,E731,W5,C901"
      - "${SUBMISSION}"
    on_failure: continue

  - name: compile
    command:
      - python3
      - "-c"
      - |
        import os, sys
        d = sys.argv[1]
        ok = True
        for py in sorted(os.listdir(d)):
            if not py.endswith(".py"):
                continue
            p = os.path.join(d, py)
            try:
                with open(p, encoding="utf-8") as f:
                    compile(f.read(), p, "exec")
            except Exception as e:
                print(e)
                ok = False
        sys.exit(0 if ok else 1)
      - "${SUBMISSION}"
    on_failure: stop

tests:
  command:
    - python3
    - /opt/grader-base/framework/testrunner.py
    - "${SUBMISSION}"
    - "${TESTS_DIR}"
