# Task structure manifest for the grader image (format 1).
#
# Baked into the image at /hopper/manifest.yaml. The build service extracts
# it (docker create + docker cp) to create missing task headings and tutor
# boxes in the exercise README; see docs/build.md in the platform monorepo
# for the contract. Task keys are immutable once a task has been graded.
format: 1

exercises:
  exercise-01:
    tasks:
      - key: "1.1"
        title: "Setup und Abgaberegeln"
        points: 0
      - key: "1.2"
        title: "Algorithmen"
        points: 4
      - key: "1.3"
        title: "Interaktiver Modus"
        points: 3
        subtasks:
          - key: "1.3a"
            title: "42 und print(42)"
            points: 1.5
          - key: "1.3b"
            title: "print(42 + ((1337 // 2) * 3) + (19 * 42)"
            points: 1.5
      - key: "1.4"
        title: "Print-Rätsel"
        points: 3
        subtasks:
          - key: "1.4a"
            title: "print1.py"
            points: 1
          - key: "1.4b"
            title: "print2.py"
            points: 1
          - key: "1.4c"
            title: "print3.py"
            points: 1